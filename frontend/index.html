<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildLedger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>BuildLedger</h1>

    <div id="login-section">
        <h2>Login</h2>

        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="login-message"></p>
    </div>

    <div id="dashboard" style="display: none;">

        <h2>Dashboard</h2>

        <button id="logout-button">Logout</button>

        <hr>

        <h3>Add Vendor</h3>

        <form id="vendor-form">

            <input
                type="text"
                id="vendor-name"
                placeholder="Vendor / Person Name"
                required
            >

            <input
                type="text"
                id="vendor-phone"
                placeholder="Phone"
            >

            <input
                type="text"
                id="vendor-description"
                placeholder="Description"
            >

            <button type="submit">Add Vendor</button>

        </form>

        <p id="vendor-message"></p>

        <h3>Vendors</h3>

        <div id="vendors-list"></div>
        
        <h3>Add Expense</h3>

        <form id="expense-form">

            <input
                type="date"
                id="expense-date"
                required
            >

            <input
                type="text"
                id="expense-category"
                placeholder="Category"
                required
            >

            <input
                type="text"
                id="expense-description"
                placeholder="Description"
                required
            >

            <select id="expense-vendor">
                <option value="">No Vendor</option>
            </select>

            <input
                type="number"
                id="expense-amount"
                placeholder="Amount"
                step="0.01"
                required
            >

            <button type="submit">Add Expense</button>

        </form>

        <p id="expense-message"></p>

        <h3>Expenses</h3>

        <div id="expense-summary">
            <p>Total Expenses: ₹<span id="total-expenses">0</span></p>
            <p>Number of Expenses: <span id="expense-count">0</span></p>
        </div>
        
        <div id="expenses-list"></div>

        <div id="edit-expense-section" style="display: none;">

            <h3>Edit Expense</h3>

            <form id="edit-expense-form">

                <input type="hidden" id="edit-expense-id">

                <input
                    type="date"
                    id="edit-expense-date"
                    required
                >

                <input
                    type="text"
                    id="edit-expense-category"
                    placeholder="Category"
                    required
                >

                <input
                    type="text"
                    id="edit-expense-description"
                    placeholder="Description"
                    required
                >

                <select id="edit-expense-vendor">
                    <option value="">No Vendor</option>
                </select>

                <input
                    type="number"
                    id="edit-expense-amount"
                    placeholder="Amount"
                    step="0.01"
                    required
                >

                <button type="submit">Update Expense</button>

                <button type="button" id="cancel-edit">
                    Cancel
                </button>

            </form>

            <p id="edit-expense-message"></p>

        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
